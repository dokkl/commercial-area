name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  APP_DIR: /opt/commercial-area

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      # Testcontainers가 러너의 Docker로 MySQL을 띄운다
      - run: ./gradlew test --no-daemon

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "image=${IMAGE}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "latest=${IMAGE}:latest" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.latest }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: SSH 설정
        env:
          HOST: ${{ secrets.LIGHTSAIL_HOST }}
          SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.LIGHTSAIL_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host lightsail
            HostName $HOST
            User ubuntu
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking yes
            ServerAliveInterval 30
          EOF

      - name: .env 생성
        env:
          APP_IMAGE: ${{ needs.build.outputs.image }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          IMPORT_INCLUDE: ${{ vars.IMPORT_INCLUDE || '서울,경기' }}
          SNAPSHOT: ${{ vars.SNAPSHOT }}
          SITE_ADDRESS: ${{ vars.SITE_ADDRESS || ':80' }}
        run: |
          : "${SNAPSHOT:?GitHub Variable SNAPSHOT(YYYYMM, 예: 202606)을 production 환경에 등록하세요}"
          umask 077
          cat > .env.prod <<EOF
          APP_IMAGE=$APP_IMAGE
          MYSQL_DATABASE=commercial_area
          MYSQL_USER=app
          MYSQL_PASSWORD=$MYSQL_PASSWORD
          MYSQL_ROOT_PASSWORD=$MYSQL_ROOT_PASSWORD
          IMPORT_INCLUDE=$IMPORT_INCLUDE
          SNAPSHOT=$SNAPSHOT
          SITE_ADDRESS=$SITE_ADDRESS
          EOF

      - name: 설정 파일 전송
        run: |
          scp deploy/docker-compose.prod.yml lightsail:"$APP_DIR/docker-compose.yml"
          scp deploy/Caddyfile lightsail:"$APP_DIR/Caddyfile"
          scp .env.prod lightsail:"$APP_DIR/.env"
          ssh lightsail "chmod 600 $APP_DIR/.env"
          rm -f .env.prod

      - name: 컨테이너 갱신
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh lightsail "docker login ghcr.io -u ${{ github.actor }} --password-stdin"
          ssh lightsail "cd $APP_DIR && docker compose pull && docker compose up -d --remove-orphans"
          ssh lightsail "docker logout ghcr.io && docker image prune -f"

      - name: 헬스체크
        run: |
          ssh lightsail 'for i in $(seq 1 40); do
              curl -fsS -o /dev/null http://127.0.0.1:8080/ && echo "healthy" && exit 0
              sleep 3
            done
            cd '"$APP_DIR"' && docker compose ps && docker compose logs --tail=150 app
            exit 1'
