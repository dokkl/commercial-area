# java.util.Properties#load(InputStream)은 파일을 ISO-8859-1로 읽으므로,
# 이 파일이 UTF-8로 저장되어 있어도 한글을 그대로 적으면 깨진다(모지바케).
# \uXXXX 이스케이프는 인코딩과 무관하게 Properties 파서가 직접 해석하므로 안전하다.
# \uc11c\uc6b8 = seoul, \uacbd\uae30 = gyeonggi
app.import.include=\uc11c\uc6b8,\uacbd\uae30
app.import.batch-size=100
app.import.dir=/tmp/unused
